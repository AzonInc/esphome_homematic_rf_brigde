esphome:
  name: wokwi-sim
  friendly_name: wokwi-sim

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    log_level: INFO

wifi:
  ssid:  Wokwi-GUEST
    
external_components:
  - source:
      type: local
      path: ../../components 

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  reboot_timeout: 0s


ota:
  - platform: esphome


uart:
  id: uart_hm
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 115200


hm_rf_bridge:
  uart_id: uart_hm
  reset_pin:
    number: GPIO04
    inverted: true
  red_led: red_led
  green_led: green_led
  blue_led: blue_led

binary_sensor:
  - platform: hm_rf_bridge
    connected:
      name: "CCU Connected"

text_sensor:
  - platform: hm_rf_bridge
    radio_module_type:
      name: HM Radio Module Type
    firmware_version:
      name: "HM Module Firmware Version"
    serial:
      name: "HM Module Serial"
    sgtin:
      name: "HM Module SGTIN"

output:
  - platform: ledc
    pin: GPIO23
    id: red_led

  - platform: ledc
    pin: GPIO22
    id: green_led

  - platform: ledc
    pin: GPIO21
    id: blue_led


web_server:
  port: 80
  version: 3